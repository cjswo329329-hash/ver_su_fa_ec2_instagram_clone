name: Deploy FastAPI to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 [1/2] 프로젝트 폴더 이동 및 최신 코드 fetch & reset..."
            if [ -d "$HOME/ver_su_fa_ec2_instagram_clone" ]; then
              cd "$HOME/ver_su_fa_ec2_instagram_clone"
            elif [ -d "$HOME/Instagram_Vercel_Supabase_FastAPI" ]; then
              cd "$HOME/Instagram_Vercel_Supabase_FastAPI"
            else
              echo "❌ 프로젝트 폴더를 찾을 수 없습니다."
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main

            echo "🚀 [2/2] backend 배포 스크립트 실행..."
            cd backend
            chmod +x deploy.sh
            bash deploy.sh
