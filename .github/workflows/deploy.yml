name: Deploy FastAPI to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 [1/5] 프로젝트 폴더 이동..."
            if [ -d "$HOME/ver_su_fa_ec2_instagram_clone" ]; then
              cd "$HOME/ver_su_fa_ec2_instagram_clone"
            elif [ -d "$HOME/Instagram_Vercel_Supabase_FastAPI" ]; then
              cd "$HOME/Instagram_Vercel_Supabase_FastAPI"
            else
              echo "❌ 프로젝트 폴더를 찾을 수 없습니다."
              exit 1
            fi

            echo "📥 [2/5] 최신 소스코드 git pull..."
            git pull origin main

            echo "📦 [3/5] 가상환경 활성화 및 패키지 설치..."
            cd backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --no-cache-dir -r requirements.txt

            echo "🔄 [4/5] 기존 서버 종료 및 uvicorn 백그라운드 재시작..."
            # 8000 포트 프로세스 종료 및 [u]vicorn 정규식 트릭(스크립트 자기 자신 종료 방지)
            fuser -k 8000/tcp 2>/dev/null || true
            pkill -f "[u]vicorn" || true
            sleep 2

            # 가상환경 내 uvicorn으로 백그라운드 무중단 실행
            nohup ./venv/bin/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 < /dev/null &

            echo "✅ [5/5] 서버 상태 확인 (3초 대기)..."
            sleep 3
            if pgrep -f "[u]vicorn" > /dev/null; then
              echo "🎉 배포 성공! FastAPI 서버가 정상 작동 중입니다."
            else
              echo "⚠️ 서버 실행 확인 실패: backend.log 최신 20줄 출력"
              tail -n 20 backend.log
              exit 1
            fi
